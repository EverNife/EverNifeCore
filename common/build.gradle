version '3.0.1'

repositories {
    maven {
        url = 'https://repo.alessiodp.com/releases/' //For the custom libby-core
    }
}

dependencies {
    compileOnly project(':api-contracts')
    implementation project(':libby')

    // EveryDatabase storage API (api scope: its types appear in common's public API).
    // The heavy runtime deps arrive via libby (minecraft) or the shadow jar (hytale).
    api 'br.com.finalcraft.everydatabase:everydatabase-core:1.0.6'
    // Typed references + per-type caching managers (write-back, parent registries).
    api 'br.com.finalcraft.everydatabase:everydatabase-manager:1.0.6'

    api('net.kyori:adventure-api:4.21.0') {
        exclude(module: 'adventure-bom')
        exclude(module: 'checker-qual')
        exclude(module: 'annotations')
    }

    compileOnly 'org.slf4j:slf4j-api:1.7.36'
    compileOnly 'org.apache.commons:commons-lang3:3.15.0'
    compileOnly 'commons-io:commons-io:2.21.0'
    compileOnly 'net.luckperms:api:5.4'

    implementation "jakarta.annotation:jakarta.annotation-api:3.0.0"
    implementation 'com.google.guava:guava:33.4.8-jre'

    implementation 'com.github.Carleslc.Simple-YAML:Simple-Yaml:1.8.4'
    implementation("net.kyori:adventure-text-serializer-gson:4.26.1")
    implementation("net.kyori:adventure-text-serializer-legacy:4.26.1")

    // FinalCraft fork: rides a Java 25 javac and still emits Java 8 bytecode (the bsideup 0.4.2 jar
    // cannot hook a Java 25 compiler). Same setup as EveryConfig/EveryDatabase.
    annotationProcessor 'br.com.finalcraft:jabel:1.2.0'
    compileOnly 'br.com.finalcraft:jabel:1.2.0'

    implementation 'net.byteflux:libby-core:1.2.0'

    // Test infra (tests compile/run on the Java 25 toolchain; main stays release 8)
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // "platoverride" stubs on the TEST classpath (in production each platform ships the
    // real implementation under the same FQN; compileOnly is absent from the test runtime)
    testImplementation project(':api-contracts')
    // H2 backend for the storage integration tests (the same Java-8-floor version as EveryDatabase)
    testRuntimeOnly 'com.h2database:h2:1.4.200'
}

// General Java 25 toolchain: used to compile/run the TESTS.
// compileJava (main) stays pinned below to JDK 16 + release 8 (Jabel).
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

configure([tasks.compileJava]) {
    sourceCompatibility = 25 // modern syntax (IDE hint; Jabel lifts javac's check); options.release governs
    options.release = 8

    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configure([tasks.compileTestJava]) {
    sourceCompatibility = 25
    targetCompatibility = 25
}

test {
    useJUnitPlatform()
}

// Publish via the POM only. The root build tags every configuration with TargetJvmVersion=25;
// baked into Gradle Module Metadata that would make this Java-8-bytecode artifact resolve as
// "JVM 25 only" and reject Java-8 consumers. Disabling it (as :minecraft does) avoids that.
tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

publishing {
    repositories {
        maven {
            name = "PetrusRepo"
            url = "https://maven.petrus.dev/public"
            credentials {
                username = System.env.PETRUSMAVEN_ACTOR
                password = System.env.PETRUSMAVEN_TOKEN
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        petrus(MavenPublication) {
            groupId = project.group
            artifactId = "evernifecore-common"
            from(components.java)
            pom.withXml {
                asNode().appendNode('url', 'https://petrus.dev')
            }
        }
    }
}