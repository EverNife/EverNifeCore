plugins {
    alias(libs.plugins.shadow)
}

java {
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

repositories {
    maven { url = 'https://repo.codemc.io/repository/creatorfromhell/' } // VaultUnlocked
    maven { url = 'https://repo.helpch.at/releases/' }                    // placeholderapi-hytale
    maven { url = 'https://repo.alessiodp.com/releases/' }                // the custom libby-core
    maven {
        name = "hytale"
        url = uri("https://maven.hytale.com/release") // "hytale-pre-release" for pre-release builds
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs')
    compileOnly libs.hytale.server

    compileOnly libs.vaultunlocked
    compileOnly libs.placeholderapi.hytale

    implementation project(':common')

    // Not used by this module's own sources: :common declares commons-lang3 compileOnly because a
    // Bukkit server already ships it, but Hytale does not - so the bundled :common code only finds
    // StringUtils/Validate if this jar carries them.
    implementation libs.commons.lang3
    implementation libs.guava
    implementation libs.adventure.api
    implementation libs.adventure.serializer.gson
    implementation libs.adventure.serializer.legacy

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

shadowJar {
    archiveBaseName.set(project.ext.evernifecore)
    archiveClassifier.set('Hytale')
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'module-info.class'

    // Hytale has no libby, so the whole EveryDatabase stack is embedded here and relocated with
    // the SAME pairs as minecraft/build.gradle and EDBDependencies - keep the three in sync.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    // Without this shadow drops the duplicate META-INF/services/java.sql.Driver entries before
    // merging and only the first driver stays discoverable (GradleUp/shadow#1348).
    mergeServiceFiles()

    dependencies {
        // mysql-connector-j is GPLv2: shipping it inside the jar would impose GPL on the artifact.
        exclude(dependency('com.mysql:mysql-connector-j'))
    }

    // Jackson pairs come from the single source in the root build (rootProject.jacksonRelocations),
    // shared with minecraft and the relocated compile artifact. jackson-annotations stays canonical.
    rootProject.jacksonRelocations.each { from, to -> relocate from, to }
    relocate 'com.zaxxer.hikari',                'br.com.finalcraft.everydatabase.libs.hikari'
    relocate 'org.slf4j',                        'br.com.finalcraft.everydatabase.libs.slf4j'
    relocate 'com.mongodb',                      'br.com.finalcraft.everydatabase.libs.mongodb'
    relocate 'org.bson',                         'br.com.finalcraft.everydatabase.libs.bson'
    relocate 'org.h2',                           'br.com.finalcraft.everydatabase.libs.h2'
    relocate 'org.postgresql',                   'br.com.finalcraft.everydatabase.libs.postgresql'
    relocate 'com.mysql',                        'br.com.finalcraft.everydatabase.libs.mysql'
    relocate 'org.checkerframework',             'br.com.finalcraft.everydatabase.libs.checkerframework'
    relocate 'org.yaml.snakeyaml',               'br.com.finalcraft.everydatabase.libs.snakeyaml'
}

processResources {
    var expandProps = [
            'name'           : project.ext.evernifecore,
            'version'        : project.version,
            'group'          : project.group,
            'author'         : author,
            'mod_description': mod_description,
            'website'        : website,
            'server_version' : server_version,
            'entry_point'    : entry_point
    ]

    filesMatching(['manifest.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

artifacts {
    archives shadowJar
}

publishing {
    repositories {
        maven {
            name = "PetrusRepo"
            url = "https://maven.petrus.dev/public"
            credentials {
                username = System.env.PETRUSMAVEN_ACTOR
                password = System.env.PETRUSMAVEN_TOKEN
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        petrus(MavenPublication) {
            groupId = project.group
            artifactId = "evernifecore-hytale"
            from(components.java)
            pom.withXml {
                asNode().appendNode('url','https://petrus.dev')
            }
        }
    }
}
