plugins {
    alias(libs.plugins.shadow)
}

version = '3.0.1'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    withJavadocJar()
}

javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

repositories {
    repositories {
        maven {
            url "https://repo.codemc.io/repository/creatorfromhell/"
        }
    }
    maven {
        url = 'https://repo.codemc.io/repository/hytale/'
        url = 'https://repo.helpch.at/releases/'
    }
    maven {
        name = "hytale"
        url = uri("https://maven.hytale.com/release") // Or "hytale-pre-release" for pre-release versions
    }
    maven {
        url = 'https://repo.alessiodp.com/releases/' //For the custom libby-core
    }
}

dependencies {
    compileOnly fileTree(dir: 'libs')

    compileOnly("com.hypixel.hytale:Server:+")

    compileOnly 'net.cfh.vault:VaultUnlocked:2.18.3'
    compileOnly 'at.helpch:placeholderapi-hytale:1.0.4'

    implementation project(':common')

    implementation 'org.slf4j:slf4j-api:1.7.36'

    implementation("net.kyori:adventure-api:4.26.1")
    implementation("net.kyori:adventure-text-serializer-gson:4.26.1")
    implementation("net.kyori:adventure-text-serializer-legacy:4.26.1")

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'com.github.Carleslc.Simple-YAML:Simple-Yaml:1.8.4'

    implementation "jakarta.annotation:jakarta.annotation-api:3.0.0"
    implementation 'com.google.guava:guava:33.4.8-jre'
    implementation 'org.apache.commons:commons-lang3:3.15.0'
    implementation 'commons-io:commons-io:2.21.0'

    //Logging
    implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.20.0'

    //Lombok
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
}

shadowJar {
    archiveBaseName.set(project.ext.evernifecore)
    archiveClassifier.set('Hytale')
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude 'module-info.class'

    // EveryDatabase (SPEC v4.1, Secao 4.2): Hytale nao permite libby - o core e TODAS as
    // deps pesadas (que fluem transitivas do everydatabase-core via :common) sao embutidas
    // aqui e relocadas para br.com.finalcraft.everydatabase.libs.* (pares identicos aos do
    // minecraft/build.gradle e do EDBDependencies). jackson-annotations fica canonico.

    // Sem isto o shadow descarta os META-INF/services/java.sql.Driver duplicados ANTES do
    // merge e so o primeiro driver seria descoberto (GradleUp/shadow#1348).
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()

    dependencies {
        // mysql-connector-j e GPLv2: redistribui-lo dentro do jar imporia GPL ao artefato
        // (mesma regra do everydatabase-standalone). Quem precisar de MySQL no Hytale
        // adiciona o driver manualmente.
        exclude(dependency('com.mysql:mysql-connector-j'))
    }

    relocate 'com.fasterxml.jackson.core',       'br.com.finalcraft.everydatabase.libs.jackson.core'
    relocate 'com.fasterxml.jackson.databind',   'br.com.finalcraft.everydatabase.libs.jackson.databind'
    relocate 'com.fasterxml.jackson.dataformat', 'br.com.finalcraft.everydatabase.libs.jackson.dataformat'
    relocate 'com.zaxxer.hikari',                'br.com.finalcraft.everydatabase.libs.hikari'
    relocate 'org.slf4j',                        'br.com.finalcraft.everydatabase.libs.slf4j'
    relocate 'com.mongodb',                      'br.com.finalcraft.everydatabase.libs.mongodb'
    relocate 'org.bson',                         'br.com.finalcraft.everydatabase.libs.bson'
    relocate 'org.h2',                           'br.com.finalcraft.everydatabase.libs.h2'
    relocate 'org.postgresql',                   'br.com.finalcraft.everydatabase.libs.postgresql'
    relocate 'com.mysql',                        'br.com.finalcraft.everydatabase.libs.mysql'
    relocate 'org.checkerframework',             'br.com.finalcraft.everydatabase.libs.checkerframework'
    // snakeyaml: usado pelo jackson-dataformat-yaml E pelo Simple-YAML bundlado - ambos
    // passam a apontar para a copia relocada unica.
    relocate 'org.yaml.snakeyaml',               'br.com.finalcraft.everydatabase.libs.snakeyaml'
}

processResources {
    var expandProps = [
            'name'           : project.ext.evernifecore,
            'fullversion'    : project.ext.fullversion,
            'group'          : project.group,
            'author'         : author,
            'mod_description': mod_description,
            'website'        : website,
            'server_version' : server_version,
            'entry_point'    : entry_point
    ]

    filesMatching(['manifest.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

artifacts {
    archives shadowJar
}

publishing {
    repositories {
        maven {
            name = "PetrusRepo"
            url = "https://maven.petrus.dev/public"
            credentials {
                username = System.env.PETRUSMAVEN_ACTOR
                password = System.env.PETRUSMAVEN_TOKEN
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        petrus(MavenPublication) {
            groupId = project.group
            artifactId = "evernifecore-hytale"
            from(components.java)
            pom.withXml {
                asNode().appendNode('url','https://petrus.dev')
            }
        }
    }
}