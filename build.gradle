import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

// Project version: single source of truth is gradle/libs.versions.toml ([versions].evernifecore).
// Captured here (root project scope, where the `libs` catalog accessor is unambiguous) and
// applied to every module below.
def evernifecoreVersion = libs.versions.evernifecore.get()

// Jackson relocation - one source for every shaded jar. The deployables (minecraft, hytale) and the
// evernifecore-common-relocated compile artifact all apply these so the relocated names match the
// classes libby delivers / the shadow jar carries at runtime. jackson-annotations is deliberately
// absent: annotations match by class identity, so they stay canonical everywhere.
ext.jacksonRelocations = [
        'com.fasterxml.jackson.core'      : 'br.com.finalcraft.everydatabase.libs.jackson.core',
        'com.fasterxml.jackson.databind'  : 'br.com.finalcraft.everydatabase.libs.jackson.databind',
        'com.fasterxml.jackson.dataformat': 'br.com.finalcraft.everydatabase.libs.jackson.dataformat',
        'com.fasterxml.jackson.datatype'  : 'br.com.finalcraft.everydatabase.libs.jackson.datatype',
]

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'br.com.finalcraft'
    version = evernifecoreVersion

    // One toolchain for the whole build: launch Gradle with JDK 25 and it compiles and runs
    // everything, including the tests. The only override is the dual-target block at the bottom.
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    project.ext.evernifecore = "EverNifeCore"

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add '-parameters' // keeps parameter names on the compiled jar
    }

    tasks.withType(Test).configureEach {
        testLogging {
            events = [TestLogEvent.PASSED, TestLogEvent.FAILED, TestLogEvent.SKIPPED]
            exceptionFormat = TestExceptionFormat.FULL
            showExceptions = true
            showCauses = true
            showStackTraces = true
        }
    }

    repositories {
        mavenCentral()
        // The sibling FinalCraft libraries resolve from mavenLocal until they are published to
        // maven.petrus.dev. Filtered so this never shadows another group's resolution.
        mavenLocal {
            content {
                includeGroup "br.com.finalcraft.everydatabase"
                includeGroup "br.com.finalcraft.everylibs"
                includeModule "br.com.finalcraft", "EveryConfig"
                includeModule "br.com.finalcraft", "ECNmsUtils"
            }
        }
        maven { url = "https://jitpack.io" }
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = 'https://maven.petrus.dev/public' }
        // Local-only jars: paid or otherwise unobtainable plugins the :minecraft side compiles
        // against. Without these that module cannot compile; the other modules still can.
        flatDir {
            dirs 'C:/Meus/workshop/workshop/MyOwnPlugins/Bukkit/FinalCraftCore/libs'
            dirs 'C:/Meus/workshop/workshop/PublicLibs'
            dirs 'C:/Meus/workshop/workshop/PublicLibs/Bukkit'
        }
    }

    dependencies {
        // Signature annotations only (@Nonnull/@Nullable): never needed at runtime.
        compileOnly libs.jakarta.annotation
        testCompileOnly libs.jakarta.annotation

        compileOnly libs.lombok
        annotationProcessor libs.lombok
        testCompileOnly libs.lombok
        testAnnotationProcessor libs.lombok
    }

    // Lets Java-8-bytecode modules still resolve JVM-11+ dependencies. Gradle 9 forbids attributes
    // on declarable-only buckets, so only consumable/resolvable configurations are tagged.
    configurations.configureEach {
        if (canBeResolved || canBeConsumed) {
            attributes {
                attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
            }
        }
    }
}

// ======================================================================
//  Dual-target: modern Java source syntax -> Java 8 bytecode
//
//  These modules are written in modern Java syntax but must run on a Java 8 JVM. The FinalCraft
//  Jabel fork (an annotation processor) lifts javac's source-level check so the Java 25 compiler
//  can emit Java 8 bytecode, while `options.release = 8` keeps the *API* floor honest - no Java 9+
//  library API can slip into code that has to run on an old server.
//
//  Unlike the upstream Jabel (which only rode javac internals up to JDK 17), the fork works on
//  JDK 25, so there is no separate compiler pin anywhere: Gradle, production compile, test compile
//  and test execution all run on the single Java 25 toolchain.
//
//  :hytale is deliberately absent - it is plain Java 25 with no bytecode cap. The version-compat
//  modules are handled by the block below, which explains why they cannot use options.release.
// ======================================================================
configure([project(':api-contracts'),
           project(':common'),
           project(':libby'),
           project(':minecraft')]) {
    dependencies {
        annotationProcessor libs.jabel
        compileOnly libs.jabel
    }

    compileJava {
        sourceCompatibility = 25 // modern *syntax* (IDE hint; Jabel lifts javac's source check)
        options.release = 8      // Java 8 *bytecode* and *API* floor
    }
}

// ======================================================================
//  Version-compat modules: Java 8 bytecode WITHOUT options.release
//
//  These reach for sun.misc.Unsafe (UnsafeUtil, and ImpIFCFlagRegistry through it) to rewrite a
//  final field in WorldGuard's flag registry. `options.release` deliberately hides the JDK's
//  internal packages, so it cannot be used here - the old source/target pair is what keeps
//  sun.misc reachable. The trade-off is that these modules get no API floor: nothing but review
//  stops a Java 9+ API from reaching a 1.7.10 server. They are plain Java 8 syntax, so no Jabel.
//
//  They still compile on the single Java 25 toolchain - no compiler pin anywhere in this build.
// ======================================================================
configure([project(':minecraft:modules:v1_7_10'),
           project(':minecraft:modules:v1_12_2'),
           project(':minecraft:modules:v1_16_5'),
           project(':minecraft:modules:VersionedPlugins')]) {
    compileJava {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}
