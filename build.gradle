plugins {

}

import org.gradle.api.tasks.testing.logging.TestExceptionFormat
import org.gradle.api.tasks.testing.logging.TestLogEvent

subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = 'br.com.finalcraft'
    version = '2.1.1'

    // Launch Gradle with JDK 25 (Gradle 9.5.1 runs on it directly). This toolchain compiles/runs
    // everything except the dual-target compileJava overrides in the per-module build files
    // (:common/:minecraft -> Java 8 via Jabel; the NMS modules -> Java 8; :hytale -> Java 25).
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }

    project.ext.evernifecore = "EverNifeCore"
    project.ext.fullversion = "2.1.1"

    //This might keep function(parameter variable's Names) on the compiled jar
    compileJava.options.compilerArgs.add '-parameters'
    compileTestJava.options.compilerArgs.add '-parameters'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        testLogging {
            events = [TestLogEvent.PASSED, TestLogEvent.FAILED, TestLogEvent.SKIPPED]
            exceptionFormat = TestExceptionFormat.FULL
            showExceptions = true
            showCauses = true
            showStackTraces = true
        }
    }

    repositories {
        // Fix issue with lwjgl-freetype not being found on macOS / ForgeGradle issue
        //
        // Could not resolve all files for configuration ':_compileJava_1'.
        // Could not find lwjgl-freetype-3.3.3-natives-macos-patch.jar (org.lwjgl:lwjgl-freetype:3.3.3).
        maven {
            url "https://libraries.minecraft.net"
            content {
                includeModule("org.lwjgl", "lwjgl-freetype")
            }
        }
        mavenCentral()
        // EveryDatabase resolves from mavenLocal until it is published to maven.petrus.dev
        // (run publishToMavenLocal in the EveryDatabase project - core AND manager are consumed).
        // The group filter keeps this repository from interfering with any other resolution.
        mavenLocal {
            content {
                includeGroup "br.com.finalcraft.everydatabase"
                // EveryConfig resolves from mavenLocal too until it is published to maven.petrus.dev.
                // Scoped to the exact module so it does not shadow other br.com.finalcraft artifacts (jabel).
                includeModule "br.com.finalcraft", "EveryConfig"
                // EveryLibs (reflection/utils/executors/common primitives) resolves from mavenLocal too.
                includeGroup "br.com.finalcraft.everylibs"
            }
        }
        maven { url = "https://jitpack.io" }
        maven { url 'https://libraries.minecraft.net/' }
        maven { url 'https://maven.petrus.dev/public' }
        flatDir { //Change this to where are your local libs
            dirs 'C:/Meus/workshop/workshop/MyOwnPlugins/Bukkit/FinalCraftCore/libs'
            dirs 'C:/Meus/workshop/workshop/PublicLibs'
            dirs 'C:/Meus/workshop/workshop/PublicLibs/Bukkit'
        }
    }

    dependencies {
        compileOnly "jakarta.annotation:jakarta.annotation-api:2.1.1"

        //Lombok
        compileOnly 'org.projectlombok:lombok:1.18.46'
        annotationProcessor 'org.projectlombok:lombok:1.18.46'
        testCompileOnly 'org.projectlombok:lombok:1.18.46'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
    }

    // Compile to Java 8 bytecode but still resolve JVM-11+ dependencies (Adventure, EveryDatabase,
    // ...). Gradle 9 forbids setting attributes on declarable-only buckets (api/implementation),
    // so apply the target-JVM attribute only to consumable/resolvable configurations.
    configurations.configureEach {
        if (canBeResolved || canBeConsumed) {
            attributes {
                attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
            }
        }
    }
}

// The NMS modules compile against old CraftBukkit (Java 8 era). Plain Java 8 bytecode, no Jabel,
configure([project(':minecraft:modules:v1_7_10'),
           project(':minecraft:modules:v1_12_2'),
           project(':minecraft:modules:v1_16_5'),
           project(':minecraft:modules:VersionedPlugins')]) {
    compileJava {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
}
