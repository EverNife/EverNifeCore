[versions]
# Project version: the single source of truth. The root build applies it to every subproject
# (the version-compat modules override it - they are never published).
evernifecore = "3.0.1"

shadow = "9.4.2"

# FinalCraft libraries
everydatabase = "1.5.0"
everyconfig = "1.4.2"
everylibs = "1.2.0"
ecnmsutils = "2.1.0"

# FinalCraft fork (same one EveryDatabase/EveryConfig use): hooks a Java 25 javac and only lifts
# javac's syntax check, so modules can write modern syntax and still emit options.release bytecode.
jabel = "1.2.0"

# Server and plugin APIs
spigot = "26.2-R0.1-SNAPSHOT"
# The two ends of the class/interface flip, and the reason they are pinned apart from the line
# above: a call's opcode is frozen at compile time, so one artifact cannot serve both shapes.
# `legacy` sees InventoryView and Biome as classes; `modern` is the oldest API where both are
# interfaces - measured on the jars themselves: InventoryView flipped in 1.21, Biome in 1.21.3
# (1.21.2 still declares it as an enum). `modern` is the floor of the era its module serves, so it
# cannot reach an API the whole era does not have.
spigot-legacy = "1.19.2-R0.1-SNAPSHOT"
spigot-modern = "1.21.3-R0.1-SNAPSHOT"
bukkit = "1.12.2-R0.1-SNAPSHOT"
hytale-server = "0.7.1"
luckperms = "5.4"
vaultunlocked = "2.20.1"
placeholderapi-hytale = "1.0.8"
# 2.11.2 is not in the public repo; this is also the one the conformance matrix
# servers load - 2.11.2 dies in its static init on 1.21.1.
placeholderapi = "2.11.6"
# The WorldEdit plugin each Bukkit flavor of the conformance matrix runs (the newest release for its game version)
matrix-worldedit6 = "6.1.9"
matrix-worldedit72 = "7.2.5"
matrix-worldedit73 = "7.3.8"
# The WorldEdit Forge mod crucible-1.7.10 runs beside the plugin, the only WorldEdit there that keeps tile entities.
# Pinned: the GTNH Nexus metadata names an older <release>.
matrix-worldedit-gtnh = "v0.0.10"
authme = "5.4.0"
griefdefender = "2.2.1"
griefpreventionplus = "13.3"
# One pair per server era the WorldGuard/WorldEdit compat modules serve.
worldguard61 = "6.1"
worldguard62 = "6.2"
worldedit6 = "6.0"
worldguard7 = "7.0.5"
worldedit7 = "7.2.5"
# The 1.7.10 server checkLinkage reads: a CrucibleMC GitHub release tag, newest staging.
crucible = "staging-ebe44c7"
crucible-build = "dev-273"

# Third-party libraries
lombok = "1.18.46"
adventure = "4.26.1"
adventure-platform = "4.4.1"
examination = "1.3.0"
kyori-option = "1.1.0"
guava = "33.4.8-jre"
libby = "1.3.1"
slf4j = "1.7.36"
log4j = "2.20.0"
jakarta-annotation = "2.1.1"
# Bundled unrelocated into the minecraft jar, so it is the contract every plugin declaring a
# validation rule compiles against. Pinned here rather than inherited from everyconfig-rules' POM:
# what goes in the jar has to be a decision, not whatever the transitive graph settles on.
jakarta-validation = "3.0.2"
nbtapi = "2.16.0"
bungeecord-chat = "1.16-R0.1"
commons-lang3 = "3.15.0"
# Deliberate old floor: compiling the Bukkit side against the oldest commons-lang3 a supported
# server ships keeps newer APIs from reaching a runtime that lacks them.
commons-lang3-legacy = "3.0"

# Bundled + relocated into the compile-view artifact evernifecore-common-relocated. Pinned to the
# same line EveryDatabase/EveryConfig compile against (their POMs declare jackson-databind 2.22.0),
# so the embedded classes and their relocated references stay on one Jackson version.
jackson = "2.22.0"
# jackson-annotations dropped the patch component at 2.20, so its line is "2.22". Together with snakeyaml,
# this is the stack EDBDependencies downloads at boot; evernifecore-minecraft-tests bundles the same one.
jackson-annotations = "2.22"
snakeyaml = "2.6"

# Test
junit = "5.10.0"
h2 = "1.4.200"

[libraries]
everydatabase-core = { module = "br.com.finalcraft.everydatabase:everydatabase-core", version.ref = "everydatabase" }
everydatabase-manager = { module = "br.com.finalcraft.everydatabase:everydatabase-manager", version.ref = "everydatabase" }
everyconfig-core = { module = "br.com.finalcraft.everyconfig:everyconfig-core", version.ref = "everyconfig" }
