[versions]
# Project version: the single source of truth. The root build applies it to every subproject
# (the version-compat modules override it - they are never published).
evernifecore = "3.0.1"

shadow = "9.4.2"

# FinalCraft libraries
everydatabase = "1.2.0"
everyconfig = "1.1.0"
everylibs = "1.0.0"
ecnmsutils = "1.1.5"
ecforgelistener = "1.0.7"

# FinalCraft fork (same one EveryDatabase/EveryConfig use): hooks a Java 25 javac and only lifts
# javac's syntax check, so modules can write modern syntax and still emit options.release bytecode.
jabel = "1.2.0"

# Server and plugin APIs
spigot = "1.19.2-R0.1-SNAPSHOT"
bukkit = "1.12.2-R0.1-SNAPSHOT"
hytale-server = "0.5.6"
luckperms = "5.4"
vaultunlocked = "2.18.3"
placeholderapi-hytale = "1.0.4"

# Third-party libraries
lombok = "1.18.46"
adventure = "4.26.1"
adventure-platform = "4.4.1"
examination = "1.3.0"
kyori-option = "1.1.0"
guava = "33.4.8-jre"
libby = "1.3.1"
slf4j = "1.7.36"
log4j = "2.20.0"
jakarta-annotation = "2.1.1"
nbtapi = "2.15.8-crucible"
bungeecord-chat = "1.16-R0.1"
commons-io = "2.6"
commons-lang3 = "3.15.0"
# Deliberate old floor: compiling the Bukkit side against the oldest commons-lang3 a supported
# server ships keeps newer APIs from reaching a runtime that lacks them.
commons-lang3-legacy = "3.0"

# Bundled + relocated into the compile-view artifact evernifecore-common-relocated. Pinned to the
# same line EveryDatabase/EveryConfig compile against (their POMs declare jackson-databind 2.22.0),
# so the embedded classes and their relocated references stay on one Jackson version.
jackson = "2.22.0"

# Test
junit = "5.10.0"
h2 = "1.4.200"

[libraries]
everydatabase-core = { module = "br.com.finalcraft.everydatabase:everydatabase-core", version.ref = "everydatabase" }
everydatabase-manager = { module = "br.com.finalcraft.everydatabase:everydatabase-manager", version.ref = "everydatabase" }
everyconfig-core = { module = "br.com.finalcraft.everyconfig:everyconfig-core", version.ref = "everyconfig" }
everyconfig-rules = { module = "br.com.finalcraft.everyconfig:everyconfig-rules", version.ref = "everyconfig" }
everylibs-common = { module = "br.com.finalcraft.everylibs:everylibs-common", version.ref = "everylibs" }
everylibs-reflection = { module = "br.com.finalcraft.everylibs:everylibs-reflection", version.ref = "everylibs" }
everylibs-utils = { module = "br.com.finalcraft.everylibs:everylibs-utils", version.ref = "everylibs" }
everylibs-executors = { module = "br.com.finalcraft.everylibs:everylibs-executors", version.ref = "everylibs" }
ecnmsutils = { module = "br.com.finalcraft:ECNmsUtils", version.ref = "ecnmsutils" }
ecforgelistener = { module = "br.com.finalcraft:ECForgeListener", version.ref = "ecforgelistener" }
jabel = { module = "br.com.finalcraft:jabel", version.ref = "jabel" }

spigot-api = { module = "org.spigotmc:spigot-api", version.ref = "spigot" }
bukkit = { module = "org.bukkit:bukkit", version.ref = "bukkit" }
hytale-server = { module = "com.hypixel.hytale:Server", version.ref = "hytale-server" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
vaultunlocked = { module = "net.cfh.vault:VaultUnlocked", version.ref = "vaultunlocked" }
placeholderapi-hytale = { module = "at.helpch:placeholderapi-hytale", version.ref = "placeholderapi-hytale" }

adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-key = { module = "net.kyori:adventure-key", version.ref = "adventure" }
adventure-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }
adventure-serializer-json = { module = "net.kyori:adventure-text-serializer-json", version.ref = "adventure" }
adventure-serializer-legacy = { module = "net.kyori:adventure-text-serializer-legacy", version.ref = "adventure" }
adventure-serializer-bungeecord = { module = "net.kyori:adventure-text-serializer-bungeecord", version.ref = "adventure-platform" }
adventure-platform-bukkit = { module = "net.kyori:adventure-platform-bukkit", version.ref = "adventure-platform" }
adventure-platform-api = { module = "net.kyori:adventure-platform-api", version.ref = "adventure-platform" }
adventure-platform-facet = { module = "net.kyori:adventure-platform-facet", version.ref = "adventure-platform" }
examination-api = { module = "net.kyori:examination-api", version.ref = "examination" }
examination-string = { module = "net.kyori:examination-string", version.ref = "examination" }
kyori-option = { module = "net.kyori:option", version.ref = "kyori-option" }

lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
libby-core = { module = "net.byteflux:libby-core", version.ref = "libby" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api", version.ref = "jakarta-annotation" }
nbtapi = { module = "de.tr7zw:item-nbt-api", version.ref = "nbtapi" }
bungeecord-chat = { module = "net.md-5:bungeecord-chat", version.ref = "bungeecord-chat" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
commons-lang3-legacy = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3-legacy" }

jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
