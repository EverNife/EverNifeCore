// ECoreConformance for Bukkit: the plugin that runs the conformance suites inside a real server. Routed beside
// the core's deployable when a server is booted for a check-up; never published, never part of the core jar.

plugins {
    alias(libs.plugins.shadow)
}

// :common and :minecraft carry these same project names; a group of their own keeps Gradle from treating
// the two pairs as one module during conflict resolution.
group = 'br.com.finalcraft.conformance'

repositories {
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
    }
    maven { url = 'https://repo.codemc.io/repository/maven-public/' } // NBT-API
    maven {
        url = 'https://repo.extendedclip.com/releases/'
        content { includeGroup 'me.clip' }
    }
}

configurations {
    // common-tests is a JUnit library as a whole; only its three JUnit-free conformance checks ride into the
    // plugin, picked by name in shadowJar below.
    conformanceChecks { transitive = false }
    // The PlaceholderAPI plugin the matrix driver routes into its servers; the published jar is the shaded plugin.
    matrixPlaceholderApi { transitive = false }
}

dependencies {
    implementation project(':conformance:common')

    // The server provides the core: compiled against, never embedded. :minecraft keeps :common and the
    // NBT-API and ECNmsUtils as implementation, so they are named again for the compile classpath.
    compileOnly project(':minecraft')
    compileOnly project(':common')
    compileOnly libs.nbtapi
    compileOnly libs.ecnmsutils
    compileOnly libs.spigot.api
    compileOnly project(':common-tests')
    conformanceChecks project(':common-tests')
    matrixPlaceholderApi libs.placeholderapi

    testImplementation project(':common-tests')
    testImplementation libs.spigot.api
    testImplementation libs.nbtapi
    testRuntimeOnly libs.junit.platform.launcher
    testRuntimeOnly libs.commons.lang3.legacy
}

// :minecraft builds no thin jar - its artifact is the shadow jar - so its classes reach the test runtime
// from the output directories instead.
evaluationDependsOn(':minecraft')
def minecraftClasses = project(':minecraft').sourceSets.main.output
dependencies {
    testRuntimeOnly minecraftClasses
}

tasks.named('jar') {
    enabled = false
}

shadowJar {
    archiveBaseName.set('ECoreConformance')
    archiveClassifier.set('')
    configurations = [project.configurations.runtimeClasspath]
    dependencies {
        include(project(':conformance:common'))
    }
    dependsOn project.configurations.conformanceChecks
    from({ zipTree(project.configurations.conformanceChecks.singleFile) }) {
        include 'br/com/finalcraft/evernifecore/testing/PlatformConformance*.class'
        include 'br/com/finalcraft/evernifecore/testing/ECEventConformance*.class'
        include 'br/com/finalcraft/evernifecore/testing/EconomyConformance*.class'
    }
    // compiled against the core's own names; the deployed core carries the relocated ones
    rootProject.applyCoreRelocations(delegate)
}

// conformance-matrix.py reads it from here by default, so the matrix needs no jar from outside the repo.
def matrixPlaceholderApiJar = tasks.register('matrixPlaceholderApiJar', Copy) {
    from configurations.matrixPlaceholderApi
    into layout.buildDirectory.dir('matrix')
    rename { 'PlaceholderAPI.jar' }
}

tasks.named('shadowJar') {
    dependsOn matrixPlaceholderApiJar
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

processResources {
    def expandProps = ['version': project.version]
    filesMatching('plugin.yml') {
        expand expandProps
    }
    inputs.properties(expandProps)
}

test {
    useJUnitPlatform()
}
