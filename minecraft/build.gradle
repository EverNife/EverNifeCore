import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    alias(libs.plugins.shadow)
}

// Only the shadow jar is deployable.
tasks.jar {
    enabled = false
}

javadoc {
    options.encoding = 'UTF-8'
}

repositories {
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
    }
    maven { url = 'https://repo.alessiodp.com/releases/' } // the custom libby-core lives here
    maven {
        name = "CodeMC"
        url = uri("https://repo.codemc.io/repository/maven-public/")
    }
    maven { url = 'https://repo.codemc.io/repository/creatorfromhell/' } // VaultUnlocked
}

// Declared ahead of the dependencies that fill them - see the evernifecore-minecraft-tests block below.
configurations {
    testKitEngine { transitive = false }
    testKitRuntimeStack { transitive = false }
}

sourceSets {
    // The Bukkit half of the test engine: this module's own tests use it, and it is published as
    // evernifecore-minecraft-tests (see testKitJar below). Wired to the main output directly rather
    // than through the java-test-fixtures plugin, which would route every consumer through the thin
    // jar this module does not build.
    testFixtures {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    test {
        compileClasspath += testFixtures.output
        runtimeClasspath += testFixtures.output
    }
    // Proves the published shape: a test compiled and run against the deployable fat jar and the test
    // kit jar alone, with the POM's other dependencies - what a plugin's own build resolves.
    testKitConsumer
}
configurations {
    testFixturesImplementation.extendsFrom implementation
    testFixturesCompileOnly.extendsFrom compileOnly
    testImplementation.extendsFrom testFixturesImplementation
}

dependencies {
    implementation project(':common')
    implementation project(':libby')

    compileOnly libs.spigot.api

    implementation project(':minecraft:modules:VersionedPlugins')
    implementation project(':minecraft:modules:v1_7_10')
    implementation project(':minecraft:modules:v1_12_2')
    implementation project(':minecraft:modules:v1_16_5')
    implementation project(':minecraft:modules:modern')

    implementation(libs.ecnmsutils) {
        exclude group: "br.com.finalcraft", module: "*"
    }
    implementation libs.libby.core

    implementation libs.nbtapi
    // Rides into the jar unrelocated (see the shadow block) - declared here so the version that
    // becomes that contract is chosen, not inherited from a transitive POM.
    implementation libs.jakarta.validation

    implementation libs.bungeecord.chat // same API from 1.7.10 onwards

    implementation libs.adventure.api
    implementation libs.adventure.key
    implementation libs.adventure.serializer.gson
    implementation libs.adventure.serializer.json
    implementation libs.adventure.serializer.legacy
    implementation libs.adventure.serializer.bungeecord
    implementation libs.adventure.platform.bukkit
    implementation libs.adventure.platform.api
    implementation libs.adventure.platform.facet
    implementation libs.examination.api
    implementation libs.examination.string
    implementation libs.kyori.option

    implementation libs.log4j.api
    implementation libs.log4j.core

    compileOnly libs.luckperms.api
    compileOnly libs.vaultunlocked
    compileOnly libs.commons.lang3.legacy

    // Local jars. FeatherBoard and BossShopPro are paid plugins: you must own them to build this.
    compileOnly name: "AuthMe-5.4.0"
    compileOnly name: "griefdefender-bukkit-2.2.1"
    compileOnly name: "GriefPreventionPlus-13.3"
    compileOnly name: "PlaceholderAPI-2.11.2"
    compileOnly name: "worldguard-bukkit-6.2.2" // prior to 1.12
    compileOnly name: "worldedit-bukkit-6.0"    // prior to 1.12
    compileOnly name: "FeatherBoard-4.28.1"
    compileOnly name: "BossShopPro-v1.9.8"
    compileOnly name: "MVdWPlaceholderAPI"
    compileOnly name: "ProtocolLib"

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    // A real server provides commons-lang3 to the code under test; the test JVM has to supply it.
    testRuntimeOnly libs.commons.lang3.legacy
    // Both are compileOnly in production - the server ships them - so the test JVM has to bring them
    // back to exercise the Vault bridges against a fake economy.
    testImplementation libs.spigot.api
    testImplementation libs.vaultunlocked
    // compileOnly in production - PlaceholderAPI is a plugin - brought back so the presence probe
    // has the real Bukkit PlaceholderAPI to find.
    testRuntimeOnly name: "PlaceholderAPI-2.11.2"
    testImplementation project(':common-tests')

    testFixturesImplementation project(':common-tests')
    testFixturesImplementation libs.spigot.api
    // Java 8 bytecode like common-tests: a consumer may run its tests on an old server's toolchain.
    testFixturesAnnotationProcessor libs.jabel
    testFixturesCompileOnly libs.jabel

    testKitEngine project(':common-tests')
    testKitRuntimeStack libs.jackson.core
    testKitRuntimeStack libs.jackson.databind
    testKitRuntimeStack libs.jackson.datatype.jsr310
    testKitRuntimeStack libs.jackson.datatype.jdk8
    testKitRuntimeStack libs.jackson.dataformat.yaml
    testKitRuntimeStack libs.jackson.dataformat.toml
    testKitRuntimeStack libs.snakeyaml

}

tasks.named('compileTestFixturesJava') {
    sourceCompatibility = 25
    options.release = 8
}
// options.release = 8 would make the fixtures ask for a Java 8 variant of this very module, whose
// variants the root build tags as 25 - the same pin the main source set compiles under.
['testFixturesCompileClasspath', 'testFixturesRuntimeClasspath'].each { name ->
    configurations.named(name) {
        attributes { attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25) }
    }
}

// Every package the deployable relocates. A jar that has to link against the deployable - the test kit
// below - applies the same list, so the two never disagree on a name.
def applyCoreRelocations = { task ->
    task.relocate 'net.byteflux.libby', 'br.com.finalcraft.libs.net.byteflux'
    task.relocate 'net.kyori', 'br.com.finalcraft.libs.net.kyori'
    task.relocate 'de.tr7zw.changeme.nbtapi', 'br.com.finalcraft.libs.minecraft.nbtapi'

    // Rewrites the embedded EveryDatabase/EveryConfig refs onto the coordinates libby delivers at
    // runtime. The Jackson pairs come from the single source in the root build (rootProject.
    // jacksonRelocations); EDBDependencies mirrors them at the runtime-download side.
    rootProject.jacksonRelocations.each { from, to -> task.relocate from, to }
    // The server ships an older canonical snakeyaml without setCodePointLimit, which EveryConfig's
    // YamlCodec calls; this points it at the snakeyaml libby delivers.
    task.relocate 'org.yaml.snakeyaml',               'br.com.finalcraft.everydatabase.libs.snakeyaml'
    task.relocate 'com.zaxxer.hikari',                'br.com.finalcraft.everydatabase.libs.hikari'
    task.relocate 'org.slf4j',                        'br.com.finalcraft.everydatabase.libs.slf4j'
    task.relocate 'com.mongodb',                      'br.com.finalcraft.everydatabase.libs.mongodb'
    task.relocate 'org.bson',                         'br.com.finalcraft.everydatabase.libs.bson'
    task.relocate 'org.h2',                           'br.com.finalcraft.everydatabase.libs.h2'
    task.relocate 'org.postgresql',                   'br.com.finalcraft.everydatabase.libs.postgresql'
    task.relocate 'com.mysql',                        'br.com.finalcraft.everydatabase.libs.mysql'
}

shadowJar {
    archiveBaseName.set(project.ext.evernifecore)
    archiveClassifier.set('')

    // Allowlist: everything else is expected from the server or fetched by libby at runtime.
    dependencies {
        include(dependency('br.com.finalcraft:ECNmsUtils:'))
        include(dependency('net.byteflux:libby-core:'))
        include(dependency('de.tr7zw:item-nbt-api:'))
        include(dependency('net.kyori:.*'))

        include(project(':common'))
        include(project(':libby'))
        include(project(':minecraft:modules:VersionedPlugins'))
        include(project(':minecraft:modules:v1_7_10'))
        include(project(':minecraft:modules:v1_12_2'))
        include(project(':minecraft:modules:v1_16_5'))
        include(project(':minecraft:modules:modern'))

        // Only the canonical EveryDatabase/EveryConfig/EveryLibs classes. Their heavy deps
        // (Jackson, Hikari, drivers, Mongo) stay out - libby downloads them already relocated.
        include(dependency('br.com.finalcraft.everydatabase:everydatabase-core:'))
        include(dependency('br.com.finalcraft.everydatabase:everydatabase-manager:'))
        include(dependency('br.com.finalcraft.everyconfig:everyconfig-core:'))
        include(dependency('br.com.finalcraft.everyconfig:everyconfig-rules:'))
        // everyconfig-rules READS these annotations reflectively, so they have to be in the jar even
        // though nothing here implements Bean Validation. NEVER relocated: a rule declared by a plugin
        // must be the same class this one looks for.
        include(dependency('jakarta.validation:jakarta.validation-api:'))
        include(dependency('br.com.finalcraft.everylibs:everylibs-common:'))
        include(dependency('br.com.finalcraft.everylibs:everylibs-reflection:'))
        include(dependency('br.com.finalcraft.everylibs:everylibs-utils:'))
        include(dependency('br.com.finalcraft.everylibs:everylibs-executors:'))
    }

    applyCoreRelocations(delegate)
}

// ======================================================================
//  evernifecore-minecraft-tests: the test engine for a plugin's Bukkit-side tests
//
//  A plugin's minecraft module compiles against evernifecore-minecraft, whose classes link against
//  RELOCATED names (Jackson, snakeyaml, kyori) and whose Jackson stack is downloaded by libby when the
//  server boots. A headless test JVM has no libby and no server, so this jar brings what the server
//  would: that same Jackson stack, relocated the same way, plus the engine - common-tests and the Bukkit
//  test fixtures (ItemWorld and its doubles: a described server, an item factory, named worlds) -
//  rewritten onto the relocated names. Its POM therefore depends on evernifecore-minecraft and never on
//  evernifecore-common: the common classes the engine drives are the relocated copies inside the fat jar.
//  Why Hytale has no counterpart, and when it gets one: src/testFixtures/.../testing/minecraft/package-info.
// ======================================================================
tasks.register('testKitJar', ShadowJar) {
    description = 'Builds evernifecore-minecraft-tests: the test engine and the runtime Jackson stack, relocated like the deployable.'
    group = 'build'
    archiveBaseName.set('evernifecore-minecraft-tests')
    archiveClassifier.set('')
    destinationDirectory.set(layout.buildDirectory.dir('test-kit'))
    from sourceSets.testFixtures.output
    configurations = [project.configurations.testKitEngine, project.configurations.testKitRuntimeStack]
    exclude 'module-info.class', 'META-INF/versions/**/module-info.class'
    // Every Jackson jar ships its own META-INF/services files; without merging, only the first copy of
    // each survives, and the relocation rewrites both the file names and the class names inside.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    mergeServiceFiles()
    applyCoreRelocations(delegate)
}

dependencies {
    testKitConsumerImplementation files(tasks.named('shadowJar'), tasks.named('testKitJar'))
    testKitConsumerImplementation libs.spigot.api
    testKitConsumerImplementation platform(libs.junit.bom)
    testKitConsumerImplementation libs.junit.jupiter
    testKitConsumerRuntimeOnly libs.junit.platform.launcher
    testKitConsumerRuntimeOnly libs.commons.lang3
    testKitConsumerRuntimeOnly libs.jackson.annotations
    testKitConsumerRuntimeOnly libs.log4j.api
}

tasks.register('testKitConsumerTest', Test) {
    description = 'Runs a plugin-shaped test against evernifecore-minecraft plus evernifecore-minecraft-tests.'
    group = 'verification'
    testClassesDirs = sourceSets.testKitConsumer.output.classesDirs
    classpath = sourceSets.testKitConsumer.runtimeClasspath
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn tasks.named('testKitConsumerTest')
}

java {
    if (gradle.startParameter.taskNames.any { it.contains('publish') }) {
        withSourcesJar()
    }
}

tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

test {
    useJUnitPlatform()
}

processResources {
    var expandProps = ['version': project.version]

    filesMatching(['plugin.yml']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

artifacts {
    archives shadowJar
}

publishing {
    repositories {
        maven {
            name = "PetrusRepo"
            url = "https://maven.petrus.dev/public"
            credentials {
                username = System.env.PETRUSMAVEN_ACTOR
                password = System.env.PETRUSMAVEN_TOKEN
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        testKit(MavenPublication) {
            groupId = project.group
            artifactId = "evernifecore-minecraft-tests"
            artifact tasks.named('testKitJar')
            pom.withXml {
                def deps = asNode().appendNode('dependencies')
                def addDep = { String g, String a, String v, String scope ->
                    def d = deps.appendNode('dependency')
                    d.appendNode('groupId', g)
                    d.appendNode('artifactId', a)
                    d.appendNode('version', v)
                    d.appendNode('scope', scope)
                }
                addDep(project.group.toString(), 'evernifecore-minecraft', project.version.toString(), 'compile')
                // provided: not transitive. The kit compiles against it, but the server API version is the
                // consumer's own choice (a 1.7.10 plugin must not be handed a 26.x API).
                addDep('org.spigotmc', 'spigot-api', libs.versions.spigot.asProvider().get(), 'provided')
                addDep('org.junit.jupiter', 'junit-jupiter', libs.versions.junit.get(), 'compile')
                // What a server hands the core and a test JVM does not have.
                addDep('org.apache.commons', 'commons-lang3', libs.versions.commons.lang3.asProvider().get(), 'runtime')
                addDep('com.fasterxml.jackson.core', 'jackson-annotations', libs.versions.jackson.annotations.get(), 'runtime')
                addDep('org.apache.logging.log4j', 'log4j-api', libs.versions.log4j.get(), 'runtime')
                asNode().appendNode('url', 'https://petrus.dev')
            }
        }
        petrus(MavenPublication) {
            groupId = project.group
            artifactId = "evernifecore-minecraft"
            from(components.java)
            pom.withXml {
                asNode().appendNode('url','https://petrus.dev')
                // The shadow jar carries its dependencies; consumers must not resolve them again.
                asNode().dependencies.'*'.each() {
                    it.parent().remove(it)
                }
            }
        }
    }
}
