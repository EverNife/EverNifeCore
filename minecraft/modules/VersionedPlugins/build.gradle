version 'dont-matter' // never published; bundled into the minecraft shadow jar

repositories {
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
    }
}

dependencies {
    compileOnly project(':common')

    // Pinned back on purpose: this module carries the pre-1.21 shape of InventoryView and Biome,
    // and the opcode it compiles is the one old servers can link.
    compileOnly libs.spigot.api.legacy

    compileOnly(libs.griefpreventionplus) { transitive = false }
    compileOnly(libs.placeholderapi) { transitive = false }
    // The 7.x jars are split in bukkit + core; their Gradle metadata pins gson/guava with `strictly`,
    // which fights the server API, and none of their transitive graph is needed to compile against them.
    compileOnly(libs.worldguard7.bukkit) { transitive = false }
    compileOnly(libs.worldguard7.core) { transitive = false }
    compileOnly(libs.worldedit7.bukkit) { transitive = false }
    compileOnly(libs.worldedit7.core) { transitive = false }

    compileOnly libs.commons.lang3.legacy
}
