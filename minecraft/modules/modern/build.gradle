version 'dont-matter' // never published; bundled into the minecraft shadow jar

repositories {
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
    }
}

dependencies {
    compileOnly project(':common')

    implementation project(':minecraft:modules:VersionedPlugins')
    // The one module that sees the post-flip shape of InventoryView and Biome. Pinned to the floor
    // of that era rather than to the current API, so nothing newer than the oldest server it serves
    // can reach these classes.
    compileOnly libs.spigot.api.modern
}
