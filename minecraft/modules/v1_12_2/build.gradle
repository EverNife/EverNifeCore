version 'dont-matter' // never published; bundled into the minecraft shadow jar

repositories {
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots'
    }
}

dependencies {
    compileOnly project(':common')

    implementation project(':minecraft:modules:VersionedPlugins')
    compileOnly libs.bukkit

    compileOnly(libs.worldguard62) { transitive = false }
    compileOnly(libs.worldedit6.bukkit) { transitive = false }
    compileOnly(libs.worldedit6.core) { transitive = false }
}
