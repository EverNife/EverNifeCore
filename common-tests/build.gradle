// evernifecore-common-tests: the test engine of EverNifeCore, published so downstream plugins get
// the same apparatus this repository uses on itself. Platform doubles, PlayerData/storage lifecycle,
// command harness and senders - one place to build a fake world instead of a copied @BeforeAll.
//
// Java 8 bytecode like `common`, because a consumer may compile its tests against a 1.7.10 server's
// toolchain. The Jabel/options.release pair is applied centrally in the root build.

dependencies {
    // api, not implementation: every one of these types shows up in this module's public signatures.
    api project(':common')
    api platform(libs.junit.bom)
    api libs.junit.jupiter

    // common keeps commons-lang3 compileOnly because a real server ships it; a headless test JVM
    // does not, and the FinalCMD framework this module drives needs it.
    api libs.commons.lang3

    // The platoverride stubs are compileOnly in common's production build, so anything compiled
    // against common's API needs them back. `api` rather than `compileOnly`: a consumer of this
    // module runs headless, where no platform supplies those classes, and the framework loads them
    // on its own while building an ECPluginData - so they have to travel with the artifact instead
    // of being rediscovered through a NoClassDefFoundError on the first harness construction.
    api project(':api-contracts')

    testRuntimeOnly libs.junit.platform.launcher
    testRuntimeOnly libs.h2 // the H2 backend, for the PlayerDataWorld tests
}

test {
    useJUnitPlatform()
}

// Same reason as common/build.gradle: the root tags every configuration with TargetJvmVersion=25,
// and baked into Gradle Module Metadata that would make this Java-8 artifact resolve as "JVM 25
// only" and reject Java 8 consumers.
tasks.withType(GenerateModuleMetadata) {
    enabled = false
}

publishing {
    repositories {
        maven {
            name = "PetrusRepo"
            url = "https://maven.petrus.dev/public"
            credentials {
                username = System.env.PETRUSMAVEN_ACTOR
                password = System.env.PETRUSMAVEN_TOKEN
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        petrus(MavenPublication) {
            groupId = project.group
            artifactId = "evernifecore-common-tests"
            from(components.java)
            pom.withXml {
                asNode().appendNode('url', 'https://petrus.dev')
            }
        }
    }
}
